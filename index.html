  footer {

const DRAW_N = 42;

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

/** Proportional section coverage then random fill to DRAW_N. */
function drawQuestions(bank, n) {
  const bySection = {};
  for (const q of bank.questions) {
    (bySection[q.section] || (bySection[q.section] = [])).push(q);
  }
  const sectionNames = Object.keys(bank.sections);
  const total = bank.total;
  const picked = [];
  const used = new Set();

  for (const sec of sectionNames) {
    const pool = bySection[sec] || [];
    if (!pool.length) continue;
    // Thin sections (e.g. Затварање, 2 Qs): take all available so both appear.
    let quota = Math.min(pool.length, Math.max(1, Math.round(n * pool.length / total)));
    if (pool.length <= 2) quota = pool.length;
    const chosen = shuffle(pool).slice(0, quota);
    for (const q of chosen) {
      picked.push(q);
      used.add(q.number);
    }
  }

  if (picked.length > n) {
    // Prefer keeping thin sections intact: drop from oversized sections first
    while (picked.length > n) {
      // find sections with more than 1 picked and largest count
      const counts = {};
      for (const q of picked) counts[q.section] = (counts[q.section] || 0) + 1;
      let victimSec = null, victimCount = 1;
      for (const [s, c] of Object.entries(counts)) {
        const avail = (bySection[s] || []).length;
        if (avail <= 2) continue; // protect thin sections
        if (c > victimCount) { victimCount = c; victimSec = s; }
      }
      if (!victimSec) break;
      for (let i = picked.length - 1; i >= 0; i--) {
        if (picked[i].section === victimSec) {
          used.delete(picked[i].number);
          picked.splice(i, 1);
          break;
        }
      }
    }
  }

  if (picked.length < n) {
    const rest = bank.questions.filter(q => !used.has(q.number));
    const fill = shuffle(rest).slice(0, n - picked.length);
    for (const q of fill) {
      picked.push(q);
      used.add(q.number);
    }
  }

  return shuffle(picked).slice(0, n);
}

function prepareItem(q) {
  const opts = shuffle(q.options.map((text, i) => ({
    text,
    id: q.number + '-' + i,
    correct: text === q.correct
  })));
  return {
    number: q.number,
    section: q.section,
    stem: q.stem,
    options: opts,
    correctText: q.correct
  };
}

let items = [];

function render() {
  const form = document.getElementById('quiz');
  const scoreEl = document.getElementById('score');
  scoreEl.classList.remove('show');
  scoreEl.textContent = '';
  form.innerHTML = '';
  document.getElementById('submit').disabled = false;

  const drawn = drawQuestions(BANK, DRAW_N);
  items = drawn.map(prepareItem);

  items.forEach((item, idx) => {
    const div = document.createElement('div');
    div.className = 'q';
    div.dataset.idx = String(idx);
    const sec = document.createElement('div');
    sec.className = 'sec';
    sec.textContent = item.section;
    const stem = document.createElement('div');
    stem.className = 'stem';
    stem.textContent = (idx + 1) + '. ' + item.stem;
    const ul = document.createElement('ul');
    ul.className = 'opts';
    item.options.forEach((opt, oi) => {
      const li = document.createElement('li');
      const label = document.createElement('label');
      const input = document.createElement('input');
      input.type = 'radio';
      input.name = 'q' + idx;
      input.value = opt.id;
      input.dataset.correct = opt.correct ? '1' : '0';
      const span = document.createElement('span');
      span.textContent = opt.text;
      label.appendChild(input);
      label.appendChild(span);
      li.appendChild(label);
      ul.appendChild(li);
    });
    div.appendChild(sec);
    div.appendChild(stem);
    div.appendChild(ul);
    form.appendChild(div);
  });
}

function grade() {
  let correct = 0;
  const cards = document.querySelectorAll('.q');
  cards.forEach((card, idx) => {
    const item = items[idx];
    const selected = card.querySelector('input[type=radio]:checked');
    card.classList.remove('wrong', 'right');
    const old = card.querySelector('.reveal');
    if (old) old.remove();

    let isCorrect = false;
    if (selected) {
      const opt = item.options.find(o => o.id === selected.value);
      isCorrect = !!(opt && opt.correct);
    }
    if (isCorrect) {
      correct++;
      card.classList.add('right');
    } else {
      card.classList.add('wrong');
      const rev = document.createElement('div');
      rev.className = 'reveal';
      rev.textContent = 'Тачан одговор: ' + item.correctText;
      card.appendChild(rev);
    }
    // lock inputs
    card.querySelectorAll('input').forEach(inp => { inp.disabled = true; });
  });

  const scoreEl = document.getElementById('score');
  const total = items.length;
  const miss = total - correct;
  scoreEl.innerHTML = 'Резултат: <span class="ok">' + correct + '</span> / ' + total +
    (miss ? ' <span class="bad">(погрешно: ' + miss + ')</span>' : ' — све тачно!');
  scoreEl.classList.add('show');
  scoreEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  document.getElementById('submit').disabled = true;
}

document.getElementById('submit').addEventListener('click', grade);
document.getElementById('retry').addEventListener('click', () => {
  window.scrollTo(0, 0);
  render();
});

render();
